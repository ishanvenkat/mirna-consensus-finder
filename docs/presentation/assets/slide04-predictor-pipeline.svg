<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 280" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#334155"/>
    </marker>
  </defs>
  <rect width="960" height="280" fill="#ffffff"/>
  <text x="480" y="34" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">General Predictor Pipeline</text>

  <g font-size="13" fill="#0f172a">
    <rect x="20" y="80" width="130" height="64" rx="10" fill="#e0e7ff" stroke="#6366f1"/>
    <text x="85" y="108" text-anchor="middle" font-weight="600">Input</text>
    <text x="85" y="128" text-anchor="middle" font-size="11" fill="#475569">miRNA + transcript</text>

    <rect x="170" y="80" width="150" height="64" rx="10" fill="#dbeafe" stroke="#2563eb"/>
    <text x="245" y="108" text-anchor="middle" font-weight="600">Candidate sites</text>
    <text x="245" y="128" text-anchor="middle" font-size="11" fill="#475569">Seed / extended rules</text>

    <rect x="340" y="80" width="150" height="64" rx="10" fill="#cffafe" stroke="#0891b2"/>
    <text x="415" y="108" text-anchor="middle" font-weight="600">Site scoring</text>
    <text x="415" y="128" text-anchor="middle" font-size="11" fill="#475569">Tool-specific features</text>

    <rect x="510" y="80" width="150" height="64" rx="10" fill="#ede9fe" stroke="#7c3aed"/>
    <text x="585" y="108" text-anchor="middle" font-weight="600">Aggregation</text>
    <text x="585" y="128" text-anchor="middle" font-size="11" fill="#475569">Site &#x2192; gene&#x2013;miRNA</text>

    <rect x="680" y="80" width="130" height="64" rx="10" fill="#fef3c7" stroke="#d97706"/>
    <text x="745" y="108" text-anchor="middle" font-weight="600">Threshold</text>
    <text x="745" y="128" text-anchor="middle" font-size="11" fill="#475569">Tool-specific cutoff</text>

    <rect x="830" y="80" width="110" height="64" rx="10" fill="#dcfce7" stroke="#16a34a"/>
    <text x="885" y="108" text-anchor="middle" font-weight="600">Output</text>
    <text x="885" y="128" text-anchor="middle" font-size="11" fill="#475569">Ranked list</text>
  </g>

  <line x1="150" y1="112" x2="170" y2="112" stroke="#334155" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="320" y1="112" x2="340" y2="112" stroke="#334155" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="490" y1="112" x2="510" y2="112" stroke="#334155" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="660" y1="112" x2="680" y2="112" stroke="#334155" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="810" y1="112" x2="830" y2="112" stroke="#334155" stroke-width="2" marker-end="url(#arr)"/>

  <text x="480" y="190" text-anchor="middle" font-size="14" fill="#334155">Each tool differs at every step &#x2014; especially seed rules, features, aggregation, and score semantics</text>

  <g font-size="12" fill="#64748b">
    <text x="85" y="230" text-anchor="middle">3&#x2032; UTR (+ CDS for DIANA)</text>
    <text x="245" y="230" text-anchor="middle">8mer vs non-canonical</text>
    <text x="415" y="230" text-anchor="middle">GLM / SVM / Context++</text>
    <text x="585" y="230" text-anchor="middle">Sum / GLM / noisy-or</text>
    <text x="745" y="230" text-anchor="middle">0.7&#x2013;0.9 / 50&#x2013;100 / class</text>
    <text x="885" y="230" text-anchor="middle">Per-source ranks</text>
  </g>
</svg>
