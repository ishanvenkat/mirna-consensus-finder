<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" font-family="Segoe UI, Arial, sans-serif">
  <rect width="960" height="480" fill="#ffffff"/>
  <text x="480" y="34" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">PTEN: Why Tools Disagree</text>
  <text x="480" y="56" text-anchor="middle" font-size="13" fill="#64748b">Same tumor-suppressor gene &#x2014; different ranked miRNAs and incompatible scores</text>

  <rect x="40" y="80" width="200" height="56" rx="10" fill="#fecaca" stroke="#ef4444" stroke-width="2"/>
  <text x="140" y="115" text-anchor="middle" font-size="18" font-weight="700" fill="#991b1b">PTEN</text>

  <line x1="240" y1="108" x2="300" y2="108" stroke="#64748b" stroke-width="2"/>
  <line x1="240" y1="108" x2="300" y2="168" stroke="#64748b" stroke-width="2"/>
  <line x1="240" y1="108" x2="300" y2="228" stroke="#64748b" stroke-width="2"/>
  <line x1="240" y1="108" x2="300" y2="288" stroke="#64748b" stroke-width="2"/>

  <g font-size="13">
    <rect x="300" y="78" width="620" height="56" rx="8" fill="#eff6ff" stroke="#2563eb"/>
    <text x="320" y="102" font-weight="700" fill="#1d4ed8">TargetScan</text>
    <text x="320" y="122" fill="#334155">Canonical 3&#x2032; UTR sites &#x2022; ranks by CWCS or occupancy &#x2022; separate PCT axis</text>

    <rect x="300" y="138" width="620" height="56" rx="8" fill="#ecfeff" stroke="#0891b2"/>
    <text x="320" y="162" font-weight="700" fill="#0e7490">DIANA-microT-CDS</text>
    <text x="320" y="182" fill="#334155">Also scans CDS &#x2022; non-canonical MREs &#x2022; microT GLM score (0.7&#x2013;0.9 cutoff)</text>

    <rect x="300" y="198" width="620" height="56" rx="8" fill="#f5f3ff" stroke="#7c3aed"/>
    <text x="320" y="222" font-weight="700" fill="#6d28d9">miRDB</text>
    <text x="320" y="242" fill="#334155">MirTarget SVM 50&#x2013;100 &#x2022; 3&#x2032; UTR only &#x2022; non-conserved sites allowed</text>

    <rect x="300" y="258" width="620" height="56" rx="8" fill="#fff7ed" stroke="#ea580c"/>
    <text x="320" y="282" font-weight="700" fill="#c2410c">mirDIP</text>
    <text x="320" y="302" fill="#334155">Noisy-or across 24 DBs (includes TS + DIANA + miRDB) &#x2022; Score Class per miRNA</text>
  </g>

  <rect x="40" y="340" width="880" height="120" rx="12" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="60" y="368" font-size="14" font-weight="700" fill="#0f172a">Documented PTEN regulators (validation context)</text>
  <text x="60" y="392" font-size="13" fill="#334155">&#x2022; <tspan font-weight="600">miR-21-5p</tspan> &#x2192; PTEN 3&#x2032; UTR: reporter validated; widely cited; TargetScan-predicted site</text>
  <text x="60" y="414" font-size="13" fill="#334155">&#x2022; <tspan font-weight="600">miR-214-3p</tspan> &#x2192; PTEN 3&#x2032; UTR: luciferase reporter validated (Yang et al. 2008); TarBase / miRTarBase</text>
  <text x="60" y="438" font-size="12" font-style="italic" fill="#64748b">Disagreement &#x2260; error &#x2014; tools prioritize different evidence (conservation vs CDS vs ML vs meta-integration)</text>
</svg>
